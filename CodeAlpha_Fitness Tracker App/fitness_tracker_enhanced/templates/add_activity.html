<!DOCTYPE html>
<html>
<head>
<title>Add Activity</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="floating-icons">
    <span>🏃</span><span>💪</span><span>🔥</span><span>❤️</span>
</div>

<nav class="navbar">
    <a href="/" class="nav-logo">⚡ FitTrack</a>
    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/add" class="active">+ Add</a>
        <a href="/history">History</a>
        <a href="/goals">Goals</a>
        <a href="/profile">Profile</a>
    </div>
</nav>

<div class="container">
    <h1 class="title">➕ Log Fitness Activity</h1>

    <div class="form-card">
        <form method="POST">

            <label>🏃 Activity Name</label>
            <input type="text" name="activity" placeholder="Morning Run, HIIT, Yoga..." required>

            <label>🏷️ Exercise Type</label>
            <select name="exercise_type" required>
                <option value="Running">🏃 Running</option>
                <option value="Cycling">🚴 Cycling</option>
                <option value="Gym">🏋️ Gym / Weightlifting</option>
                <option value="Yoga">🧘 Yoga</option>
                <option value="Swimming">🏊 Swimming</option>
                <option value="Walking">🚶 Walking</option>
                <option value="HIIT">⚡ HIIT</option>
                <option value="Sports">⚽ Sports</option>
                <option value="Other">📦 Other</option>
            </select>

            <label>📅 Date</label>
            <input type="date" name="date" value="{{ today }}" required>

            <label>⏱ Duration (Minutes)</label>
            <input type="number" name="duration" placeholder="45" min="1" required>

            <label>🔥 Calories Burned</label>
            <input type="number" name="calories" placeholder="350" min="0" required>

            <label>👣 Steps</label>
            <input type="number" name="steps" placeholder="5000" min="0" required>

            <button type="submit" class="btn">💾 Save Activity</button>
        </form>

        <br>
        <a href="/"><button class="btn">🏠 Dashboard</button></a>
    </div>
</div>

</body>
</html>
