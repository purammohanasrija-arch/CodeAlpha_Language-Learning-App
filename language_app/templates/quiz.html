<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — LinguaLearn</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
.quiz-progress-bar { width:100%; height:8px; background:rgba(255,255,255,.1); border-radius:10px; margin-bottom:24px; overflow:hidden; }
.quiz-progress-fill { height:100%; background:linear-gradient(90deg,#ff00ff,#00ffff); border-radius:10px; transition:width .4s; }
.question-num { color:rgba(255,255,255,.5); font-size:.9rem; }
.question-text { font-size:1.3rem; font-weight:600; margin-bottom:24px; line-height:1.4; }
.options-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.option-btn {
  padding:14px 16px; border:1px solid rgba(255,255,255,.15); border-radius:14px;
  background:rgba(255,255,255,.05); color:white; font-size:1rem; cursor:pointer;
  transition:.25s; text-align:left;
}
.option-btn:hover { background:rgba(255,255,255,.12); border-color:rgba(0,255,255,.4); }
.option-btn.correct { background:rgba(0,255,100,.2); border-color:#00ff64; color:#00ff64; }
.option-btn.wrong   { background:rgba(255,50,50,.2);  border-color:#ff3232; color:#ff3232; }
.option-btn:disabled { cursor:default; }
.feedback { text-align:center; font-size:1.1rem; min-height:28px; margin-bottom:16px; font-weight:600; }
.score-screen { text-align:center; padding:20px; }
.big-score { font-size:4rem; font-weight:800; background:linear-gradient(90deg,#ff00ff,#00ffff); -webkit-background-clip:text; color:transparent; }
.score-label { font-size:1.1rem; color:rgba(255,255,255,.6); margin-bottom:20px; }
.badge { display:inline-block; padding:6px 18px; border-radius:30px; font-weight:700; font-size:1rem; margin-bottom:24px; }
.badge.gold   { background:linear-gradient(90deg,#ffd700,#ffaa00); color:#000; }
.badge.silver { background:linear-gradient(90deg,#c0c0c0,#888); color:#000; }
.badge.bronze { background:linear-gradient(90deg,#cd7f32,#a0522d); color:#fff; }
.badge.try    { background:rgba(255,255,255,.1); color:white; border:1px solid rgba(255,255,255,.2); }
@media(max-width:480px){ .options-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span></div>

<div class="container">
  <a href="/" class="back-link">← Home</a>
  <h1 class="title">🧠 Quiz</h1>

  <!-- Category tabs -->
  <div class="tab-row">
    <a href="/quiz?category=all" class="tab {% if category=='all' %}active{% endif %}">All</a>
    {% for cat in categories %}
    <a href="/quiz?category={{ cat }}" class="tab {% if cat == category %}active{% endif %}">{{ cat.capitalize() }}</a>
    {% endfor %}
  </div>

  <div class="card" style="max-width:600px;margin:0 auto;" id="quizCard">
    <div id="quizBody"></div>
  </div>
</div>

<script>
const questions = {{ questions | safe }};
let current = 0, score = 0, answered = false;

function renderQuestion() {
  const q = questions[current];
  const pct = (current / questions.length) * 100;
  document.getElementById('quizBody').innerHTML = `
    <div class="quiz-header">
      <span class="question-num">Question ${current+1} of ${questions.length}</span>
      <span class="question-num">Score: <strong style="color:#00ffff">${score}</strong></span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="question-text">${q.question}</div>
    <div class="options-grid" id="optionsGrid">
      ${q.options.map(o => `<button class="option-btn" onclick="checkAnswer(this,'${o}','${q.answer}')">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none;width:100%;">
      ${current === questions.length-1 ? '🏁 See Results' : 'Next Question →'}
    </button>
  `;
  answered = false;
}

function checkAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => { b.disabled = true; });

  if (chosen === correct) {
    btn.classList.add('correct');
    document.getElementById('feedback').innerHTML = '<span style="color:#00ff64">✅ Correct!</span>';
    score++;
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => { if (b.textContent === correct) b.classList.add('correct'); });
    document.getElementById('feedback').innerHTML = `<span style="color:#ff6464">❌ The answer is <strong>${correct}</strong></span>`;
  }
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  const pct = Math.round((score / questions.length) * 100);
  let badge, badgeClass;
  if (pct >= 90) { badge = '🥇 Excellent!'; badgeClass = 'gold'; }
  else if (pct >= 70) { badge = '🥈 Good job!'; badgeClass = 'silver'; }
  else if (pct >= 50) { badge = '🥉 Keep going!'; badgeClass = 'bronze'; }
  else { badge = '📚 Study more!'; badgeClass = 'try'; }

  // Save to localStorage
  const prev = JSON.parse(localStorage.getItem('quizHistory') || '[]');
  prev.push({ score, total: questions.length, pct, date: new Date().toLocaleDateString() });
  localStorage.setItem('quizHistory', JSON.stringify(prev));

  const best = Math.max(...prev.map(h => h.pct));
  localStorage.setItem('bestScore', best);
  localStorage.setItem('quizzesTaken', prev.length);

  document.getElementById('quizBody').innerHTML = `
    <div class="score-screen">
      <div class="big-score">${score}/${questions.length}</div>
      <div class="score-label">You scored ${pct}%</div>
      <div class="badge ${badgeClass}">${badge}</div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn" onclick="restartQuiz()">🔄 Try Again</button>
        <a href="/progress"><button class="btn">📈 My Progress</button></a>
        <a href="/"><button class="btn">🏠 Home</button></a>
      </div>
    </div>
  `;
}

function restartQuiz() { current = 0; score = 0; renderQuestion(); }

if (questions.length > 0) {
  renderQuestion();
} else {
  document.getElementById('quizBody').innerHTML = '<p style="text-align:center;padding:30px;">No questions available for this category.</p>';
}
</script>
</body>
</html>
